name: Workspace Benchmark

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Benchmark tools (comma-separated: cmake, satria)"
        type: choice
        required: true
        default: cmake,satria
        options:
          - cmake
          - satria
          - cmake,satria
          - satria,cmake
      warmup:
        description: "Run untimed warm-up"
        type: boolean
        default: true
      artifacts:
        description: "Keep and upload benchmark logs/artifacts"
        type: boolean
        default: true
      strace:
        description: "Enable syscall profiling (strace; slower on large workspaces)"
        type: boolean
        default: false
      audit:
        description: "Validate actual workspace work before timing"
        type: boolean
        default: true
      sources:
        description: "C sources per project (core and bade)"
        type: number
        required: true
        default: 100
      repeats:
        description: "Measured repetitions per scenario"
        type: number
        required: true
        default: 5
      headers:
        description: "Header chain length per project"
        type: number
        required: true
        default: 20
      delay:
        description: "Seconds between measurements (-D)"
        type: number
        required: true
        default: 2
      mutation_delay:
        description: "Seconds before edits (-d)"
        type: number
        required: true
        default: 0
      modules:
        description: "Number of .rp modules"
        type: number
        required: true
        default: 20

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BENCH_TOOLS: ${{ inputs.tools }}
      BENCH_ARTIFACTS: ${{ inputs.artifacts }}
      BENCH_AUDIT: ${{ inputs.audit }}
      BENCH_STRACE: ${{ inputs.strace }}
      BENCH_SOURCES: ${{ inputs.sources }}
      BENCH_REPEATS: ${{ inputs.repeats }}
      BENCH_HEADERS: ${{ inputs.headers }}
      BENCH_MODULES: ${{ inputs.modules }}
      BENCH_DELAY: ${{ inputs.delay }}
      BENCH_MUTATION_DELAY: ${{ inputs.mutation_delay }}

    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build time

      - name: Bootstrap satria
        run: |
          ./install.sh --dev
          test -x bin/satria

      - name: Capture runner environment
        if: ${{ inputs.artifacts }}
        run: |
          mkdir -p benchmark-results
          {
            date -u
            uname -a
            lscpu
            free -h
            df -h .
            gcc --version | head -1
            cmake --version
            ninja --version
            bin/satria version || true
          } | tee benchmark-results/runner.txt

      # The first measured run must not also be the first ever invocation of
      # satria, GCC, the archiver, or Ninja on this runner. Warm up BOTH tools
      # with an independent workspace, preserving the real cold-build work in
      # every subsequent measured repetition.
      - name: Warm up selected tools (not measured)
        if: ${{ inputs.warmup }}
        run: |
          bash bench/ws.sh \
            -b "$PWD/bin/satria" \
            -n "$BENCH_SOURCES" \
            -H "$BENCH_HEADERS" \
            -m "$BENCH_MODULES" \
            -r 1 -t "$BENCH_TOOLS" -w false -strace false -artifacts "$BENCH_ARTIFACTS" \
            -o "$PWD/benchmark-results/warmup" \
            > benchmark-results/warmup.log 2>&1
          rc=$?
          cat benchmark-results/warmup.log
          if [ "$BENCH_ARTIFACTS" != true ]; then rm -f benchmark-results/warmup.log; fi
          exit "$rc"

      - name: Measure workspace benchmark
        run: |
          mkdir -p benchmark-results

          bash bench/ws.sh \
            -b "$PWD/bin/satria" \
            -n "$BENCH_SOURCES" \
            -H "$BENCH_HEADERS" \
            -m "$BENCH_MODULES" \
            -r "$BENCH_REPEATS" \
            -t "$BENCH_TOOLS" \
            -D "$BENCH_DELAY" \
            -d "$BENCH_MUTATION_DELAY" \
            -O abba -w "$BENCH_AUDIT" -strace "$BENCH_STRACE" -artifacts "$BENCH_ARTIFACTS" \
            -o "$PWD/benchmark-results/measured" \
            > benchmark-results/measured.log 2>&1
          rc=$?
          cat benchmark-results/measured.log
          if [ "$BENCH_ARTIFACTS" != true ]; then rm -f benchmark-results/measured.log; fi
          exit "$rc"

      - name: Upload benchmark artifacts
        if: ${{ always() && inputs.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ inputs.tools }}-n${{ inputs.sources }}-r${{ inputs.repeats }}
          path: benchmark-results/
          if-no-files-found: warn

name: Workspace Benchmark

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Benchmark tools (comma-separated: cmake, satria)"
        type: choice
        required: true
        default: cmake,satria
        options:
          - cmake
          - satria
          - cmake,satria
          - satria,cmake
      warmup:
        description: "Prime each tool once before measuring (untimed, built into satria bench)"
        type: boolean
        default: true
      artifacts:
        description: "Keep and upload benchmark logs/CSV"
        type: boolean
        default: true
      strace:
        description: "Enable syscall profiling (strace; slower on large workspaces)"
        type: boolean
        default: false
      sources:
        description: "C sources per project (core and bade)"
        type: number
        required: true
        default: 100
      repeats:
        description: "Measured repetitions per scenario (median)"
        type: number
        required: true
        default: 5
      headers:
        description: "Header chain length per project"
        type: number
        required: true
        default: 20
      modules:
        description: "Number of .rp modules"
        type: number
        required: true
        default: 20

  # Tag rilis (v*) yang di-push pengguna memicu uji benchmark otomatis —
  # event `release: published` yang dibuat GITHUB_TOKEN di release.yml
  # TIDAK memicu workflow lain (GitHub memblokir rekursi).
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Fallback untuk trigger push tag (input workflow kosong di event itu).
      # Boolean TIDAK boleh `x || default`: false ikut falsy, jadi pakai
      # perbandingan eksplisit.
      BENCH_TOOLS: ${{ inputs.tools || 'cmake,satria' }}
      BENCH_ARTIFACTS: ${{ inputs.artifacts == false && 'false' || 'true' }}
      BENCH_STRACE: ${{ inputs.strace == true && 'true' || 'false' }}
      BENCH_SOURCES: ${{ inputs.sources || 100 }}
      BENCH_REPEATS: ${{ inputs.repeats || 5 }}
      BENCH_HEADERS: ${{ inputs.headers || 20 }}
      BENCH_MODULES: ${{ inputs.modules || 20 }}
      BENCH_WARMUP: ${{ inputs.warmup == false && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build

      - name: Bootstrap satria
        run: |
          ./install.sh --dev
          test -x bin/satria

      - name: Capture runner environment
        if: ${{ env.BENCH_ARTIFACTS == 'true' }}
        run: |
          mkdir -p benchmark-results
          {
            date -u
            uname -a
            lscpu
            free -h
            df -h .
            gcc --version | head -1
            cmake --version
            bin/satria version || true
          } | tee benchmark-results/runner.txt

      # Benchmark berjalan penuh di C: `satria bench --workspace` (src/bench).
      # Warmup/audit/rolling built-in; audit kerja per skenario selalu jalan
      # (dilaporkan di Detailed Validation Log), tidak ada lagi bench/ws.sh.
      - name: Measure workspace benchmark (bin/satria bench --workspace)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          args=(--workspace -f "tools=$BENCH_TOOLS" -f "source=$BENCH_SOURCES"
                -f "header=$BENCH_HEADERS" -f "module=$BENCH_MODULES"
                -f "runs=$BENCH_REPEATS" -f "warmup=$BENCH_WARMUP" -f "trace=$BENCH_STRACE")
          if [[ "$BENCH_ARTIFACTS" == true ]]; then
            bin/satria bench "${args[@]}" -f artifact=true -f out="$PWD/benchmark-results/measured" \
              2>&1 | tee benchmark-results/measured.log
          else
            bin/satria bench "${args[@]}" -f artifact=false -f out="$RUNNER_TEMP/satria-ws"
          fi

      - name: Upload benchmark artifacts
        if: ${{ always() && env.BENCH_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ env.BENCH_TOOLS }}-n${{ env.BENCH_SOURCES }}-r${{ env.BENCH_REPEATS }}
          path: benchmark-results/
          if-no-files-found: warn

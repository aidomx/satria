name: Profile Editrel

# Sementara (eksperimen optimasi editrel): jalankan satria dengan SATRIA_PROFILE
# pada kondisi editrel single-project di runner CI, lalu unggah log fase.
on:
  workflow_dispatch:
    inputs:
      sources:
        type: number
        default: 150
      headers:
        type: number
        default: 30

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: ./install.sh --dev

      - name: Generate and prime project
        run: |
          rm -rf /tmp/pb && mkdir -p /tmp/pb
          ./bin/satria bench -f tools=satria -f source=${{ inputs.sources }} \
            -f header=${{ inputs.headers }} -f runs=1 -f scenario=editrel \
            -f warmup=true -f artifact=true -f keep=true -f out=/tmp/pb/bench.tmp

      - name: Profile incremental relink
        env:
          SATRIA_PROFILE: "1"
        run: |
          set -e
          W=/tmp/pb/bench.tmp/satria
          cd "$W"
          for i in 1 2 3 4 5; do
            printf '\nint probe_%d(void){return %d;}\n' "$i" "$i" >> src/t1.c
            /usr/bin/time -f "wall=%e user=%U sys=%S" \
              "$GITHUB_WORKSPACE/bin/satria" >/tmp/pb/out$i.log 2>/tmp/pb/err$i.log
            echo "=== run $i"
            grep -E "^wall=" /tmp/pb/err$i.log || true
            sed -n '/> Profile/,$p' /tmp/pb/err$i.log | head -28
          done

      - name: Upload profile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editrel-profile
          path: /tmp/pb

name: Single-Project Benchmark

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tools (ninja,make,bear,satria,cmake,meson,xmake). tup belum didukung.'
        type: string
        required: true
        default: 'ninja,cmake,satria'
      sources:
        description: 'Number of generated C sources'
        type: number
        required: true
        default: 150
      headers:
        description: 'Number of generated headers'
        type: number
        required: true
        default: 30
      repeats:
        description: 'Measured repetitions'
        type: number
        required: true
        default: 5
      warmup:
        description: 'Run an untimed warm-up'
        type: boolean
        default: true
      audit:
        description: 'Run untimed actual-work audit'
        type: boolean
        default: true
      artifacts:
        description: 'Keep and upload logs/CSV'
        type: boolean
        default: true
      strace:
        description: 'Add no-op syscall profiling (strace -c -f); installs strace'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BENCH_TOOLS: ${{ inputs.tools }}
      BENCH_SOURCES: ${{ inputs.sources }}
      BENCH_HEADERS: ${{ inputs.headers }}
      BENCH_REPEATS: ${{ inputs.repeats }}
      BENCH_AUDIT: ${{ inputs.audit }}
      BENCH_ARTIFACTS: ${{ inputs.artifacts }}
      BENCH_STRACE: ${{ inputs.strace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Dasar selalu dipasang: ninja, make, gcc (wajib di bench/compare.sh).
          pkgs=(build-essential ninja-build make time)
          want_xmake=0
          IFS=',' read -r -a requested <<< "$BENCH_TOOLS"
          for raw in "${requested[@]}"; do
            t="${raw//[[:space:]]/}"
            case "$t" in
              ""|ninja|make|satria) ;;
              cmake)  pkgs+=(cmake) ;;
              meson)  pkgs+=(meson) ;;
              bear)   pkgs+=(bear) ;;
              xmake)  want_xmake=1 ;;
              tup)
                echo "::error::tool 'tup' belum didukung oleh workflow ini; hapus dari input tools" >&2
                exit 1 ;;
              *)
                echo "::error::tool tidak dikenal: $t" >&2
                exit 1 ;;
            esac
          done
          if [[ "$BENCH_STRACE" == true ]]; then
            pkgs+=(strace)
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          if [[ "$want_xmake" == 1 ]]; then
            curl -fsSL https://xmake.io/shget.text | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          # Verifikasi: setiap tool yang diminta harus benar-benar bisa dieksekusi.
          missing=0
          for raw in "${requested[@]}"; do
            t="${raw//[[:space:]]/}"
            case "$t" in
              ""|satria) continue ;;
            esac
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::tool '$t' tidak ditemukan setelah instalasi" >&2
              missing=1
            fi
          done
          if [[ "$BENCH_STRACE" == true ]] && ! command -v strace >/dev/null 2>&1; then
            echo "::error::strace tidak ditemukan setelah instalasi" >&2
            missing=1
          fi
          exit "$missing"
      - name: Bootstrap Satria
        run: |
          ./install.sh --dev
          test -x bin/satria
      - name: Warm up (untimed)
        if: ${{ inputs.warmup }}
        shell: bash
        run: |
          set -euo pipefail
          args=(-b "$PWD/bin/satria" -t "$BENCH_TOOLS" -n "$BENCH_SOURCES" -H "$BENCH_HEADERS" -r 1 -A -o "$RUNNER_TEMP/satria-compare-warmup")
          bash bench/compare.sh "${args[@]}"
          rm -rf "$RUNNER_TEMP/satria-compare-warmup"
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          args=(-b "$PWD/bin/satria" -t "$BENCH_TOOLS" -n "$BENCH_SOURCES" -H "$BENCH_HEADERS" -r "$BENCH_REPEATS")
          if [[ "$BENCH_AUDIT" != true ]]; then args+=(-A); fi
          # -s membatasi skenario. strace hanya berjalan bila diminta lewat -s,
          # jadi daftar default ditulis lengkap ditambah strace.
          if [[ "$BENCH_STRACE" == true ]]; then
            args+=(-s cold,noop,touch,edit,editrel,compdb,strace)
          fi
          if [[ "$BENCH_ARTIFACTS" == true ]]; then
            mkdir -p benchmark-results
            args+=(-k -o "$PWD/benchmark-results/compare")
            bash bench/compare.sh "${args[@]}" 2>&1 | tee benchmark-results/compare.log
          else
            args+=(-o "$RUNNER_TEMP/satria-compare-measured")
            bash bench/compare.sh "${args[@]}"
            rm -rf "$RUNNER_TEMP/satria-compare-measured"
          fi
      - name: Upload artifacts
        if: ${{ always() && inputs.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ inputs.sources }}-r${{ inputs.repeats }}
          path: benchmark-results/
          if-no-files-found: warn

name: Single-Project Benchmark

# SEMENTARA (cabang eksperimen): versi file ini di cabang exp hanya menjalankan
# profil fase editrel di runner CI. Jangan digabung ke main.
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tools'
        type: string
        required: true
        default: 'satria'
      sources:
        description: 'Number of generated C sources'
        type: number
        required: true
        default: 150
      headers:
        description: 'Number of generated headers'
        type: number
        required: true
        default: 30
      repeats:
        description: 'Measured repetitions (median)'
        type: number
        required: true
        default: 5
      warmup:
        description: 'Prime each tool once before measuring'
        type: boolean
        default: true
      artifacts:
        description: 'Keep and upload logs/CSV'
        type: boolean
        default: true
      strace:
        description: 'Add no-op syscall profiling'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: ./install.sh --dev

      - name: Generate and prime project
        run: |
          rm -rf /tmp/pb && mkdir -p /tmp/pb
          ./bin/satria bench -f tools=satria -f source=${{ inputs.sources }} \
            -f header=${{ inputs.headers }} -f runs=1 -f scenario=editrel \
            -f warmup=true -f artifact=true -f keep=true -f out=/tmp/pb/bench.tmp

      - name: Profile incremental relink
        env:
          SATRIA_PROFILE: "1"
        run: |
          set -e
          W=/tmp/pb/bench.tmp/satria
          SAT="$GITHUB_WORKSPACE/bin/satria"
          cd "$W"
          for i in $(seq 1 8); do
            printf '\nint probe_%d(void){return %d;}\n' "$i" "$i" >> src/t1.c
            python3 - "$SAT" "$i" <<'PY'
          import subprocess, sys, time
          sat, i = sys.argv[1], sys.argv[2]
          err = open("/tmp/pb/err%s.log" % i, "wb")
          t = time.perf_counter()
          r = subprocess.run([sat], stdout=subprocess.DEVNULL, stderr=err)
          ms = (time.perf_counter() - t) * 1000.0
          err.close()
          print("=== run %s wall_ms=%.1f rc=%d" % (i, ms, r.returncode))
          PY
            sed -n '/> Profile/,$p' "/tmp/pb/err$i.log" | sed 's/^/    /'
          done

      - name: Upload profile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editrel-profile
          path: /tmp/pb

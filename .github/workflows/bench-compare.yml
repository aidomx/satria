name: Single-Project Benchmark

on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tools (ninja,make,bear,satria,cmake,meson,xmake). tup belum didukung.'
        type: string
        required: true
        default: 'ninja,cmake,satria'
      sources:
        description: 'Number of generated C sources'
        type: number
        required: true
        default: 150
      headers:
        description: 'Number of generated headers'
        type: number
        required: true
        default: 30
      repeats:
        description: 'Measured repetitions (median)'
        type: number
        required: true
        default: 5
      warmup:
        description: 'Prime each tool once before measuring (untimed, built into satria bench)'
        type: boolean
        default: true
      artifacts:
        description: 'Keep and upload logs/CSV'
        type: boolean
        default: true
      strace:
        description: 'Add no-op syscall profiling (strace -c); installs strace'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BENCH_TOOLS: ${{ inputs.tools }}
      BENCH_SOURCES: ${{ inputs.sources }}
      BENCH_HEADERS: ${{ inputs.headers }}
      BENCH_REPEATS: ${{ inputs.repeats }}
      BENCH_WARMUP: ${{ inputs.warmup }}
      BENCH_ARTIFACTS: ${{ inputs.artifacts }}
      BENCH_STRACE: ${{ inputs.strace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Dasar: build-essential (gcc, ar), ninja-build, make (gcc-floor).
          pkgs=(build-essential ninja-build make)
          want_xmake=0
          IFS=',' read -r -a requested <<< "$BENCH_TOOLS"
          for raw in "${requested[@]}"; do
            t="${raw//[[:space:]]/}"
            case "$t" in
              ""|ninja|make|satria) ;;
              cmake)  pkgs+=(cmake) ;;
              meson)  pkgs+=(meson) ;;
              bear)   pkgs+=(bear) ;;
              xmake)  want_xmake=1 ;;
              tup)
                echo "::error::tool 'tup' belum didukung oleh workflow ini; hapus dari input tools" >&2
                exit 1 ;;
              *)
                echo "::error::tool tidak dikenal: $t" >&2
                exit 1 ;;
            esac
          done
          if [[ "$BENCH_STRACE" == true ]]; then
            pkgs+=(strace)
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          if [[ "$want_xmake" == 1 ]]; then
            curl -fsSL https://xmake.io/shget.text | bash
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          # Verifikasi: setiap tool yang diminta harus benar-benar bisa dieksekusi.
          missing=0
          for raw in "${requested[@]}"; do
            t="${raw//[[:space:]]/}"
            case "$t" in
              ""|satria) continue ;;
            esac
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::tool '$t' tidak ditemukan setelah instalasi" >&2
              missing=1
            fi
          done
          if [[ "$BENCH_STRACE" == true ]] && ! command -v strace >/dev/null 2>&1; then
            echo "::error::strace tidak ditemukan setelah instalasi" >&2
            missing=1
          fi
          exit "$missing"
      - name: Bootstrap Satria
        run: |
          ./install.sh --dev
          test -x bin/satria
      # Benchmark berjalan penuh di C: `satria bench` (src/bench). Warmup/
      # audit/rolling built-in; tidak ada lagi pemanggilan bench/*.sh.
      - name: Measure (bin/satria bench)
        shell: bash
        run: |
          set -euo pipefail
          args=(-f "tools=$BENCH_TOOLS" -f "source=$BENCH_SOURCES" -f "header=$BENCH_HEADERS"
                -f "runs=$BENCH_REPEATS" -f "warmup=$BENCH_WARMUP" -f "trace=$BENCH_STRACE")
          if [[ "$BENCH_ARTIFACTS" == true ]]; then
            mkdir -p benchmark-results/compare
            bin/satria bench "${args[@]}" -f artifact=true -f out="$PWD/benchmark-results/compare" \
              2>&1 | tee benchmark-results/compare.log
          else
            bin/satria bench "${args[@]}" -f artifact=false -f out="$RUNNER_TEMP/satria-compare"
          fi
      - name: Upload artifacts
        if: ${{ always() && inputs.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ inputs.sources }}-r${{ inputs.repeats }}
          path: benchmark-results/
          if-no-files-found: warn

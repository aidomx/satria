# Pengujian manual di Windows/MSVC (workflow_dispatch — TIDAK jalan di
# push/PR/release; dipicu: `gh workflow run tests-manual.yml`).
#
# Temuan run pertama 05/11/2026 (setelah fix LNK2019 pclose/`pcloseRB` —
# bootstrap + self-host MSVC SUDAH lulus; log: unit suite step):
#   - Fixture & log HARUS path ABSOLUT (runner men-cd ke salinan tmp
#     sebelum mengeksekusi test): relatif membuat abspath() test gagal
#     ("cp: cannot stat 'tests/miniws/.'", "fixture tidak ditemukan: (kosong)")
#     dan log hilang dari upload-artifact. Sudah ditangani: input diubah
#     absolut via cygpath (step "Fixture suite absolut").
#   - autocrlf: run hijau 08/11 (PASS=241 FAIL=0, miniws) membuktikan
#     trace_src_sync & cmdhelp_crlf lulus dengan default runner — tanpa
#     koreksi apa pun (input `config:` checkout@v4 ternyata invalid dan
#     hanya menghasilkan annotation warning; dihapus 10/11/2026).
#
# Yang diharapkan GAGAL di Windows (jalur POSIX — jangan dianggap regresi):
#   - trace_summary.sh → `satria trace` menolak (LD_PRELOAD/dlsym tidak ada;
#     cmdTrace menolak dengan rc=2).
#   - build_resume.sh D (Ctrl+C rc 130) → semantik SIGINT tidak 1:1 di
#     git-bash/Windows (dapat 0).
#   - faststate_external_header.sh ("steady state is no-op") → SATU-satunya
#     logika yang mungkin nyata; perlu investigasi (mtime NTFS?).
#
# Runner scripts/unit.sh menjalankan semua tes terdaftar di classes.conf
# — CLI: <binary> <target-nama> [-j N] [-o log]; tes di tests/unit/common
# + tes khusus fixture di tests/unit/<target-nama>/.
name: Tests Manual (Windows/MSVC)

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        description: "Fixture workspace untuk suite (dir; default tests/miniws)"
        required: false
        default: "tests/miniws"
      suite2:
        type: string
        description: "Fixture kedua opsional; kosongkan bila tidak perlu (dibangun pending boleh)"
        required: false
        default: ""
      jobs:
        type: string
        description: "Batas job satria per test (-j scripts/unit.sh; default 2)"
        required: false
        default: "2"

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        # Pelajaran run 05/11/2026 TERNYATA SALAH: input `config` TIDAK ADA
        # di actions/checkout@v4 (annotation "Unexpected input(s) 'config'")
        # → diabaikan, core.autocrlf tetap default runner. Empiris run hijau
        # 08/11 (PASS=241 FAIL=0, miniws): trace_src_sync & cmdhelp_crlf
        # lulus dengan default itu — tidak perlu koreksi autocrlf.

      - name: Fixture suite absolut (bash MSYS butuh gaya POSIX)
        if: ${{ inputs.suite != '' }}
        shell: bash
        id: suite
        run: |
          WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          echo "suite=$WS/${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          SUITE2="${{ inputs.suite2 }}"
          if [ -n "$SUITE2" ]; then
            echo "suite2=$WS/$SUITE2" >> "$GITHUB_OUTPUT"
          fi
          # Pelajaran run 05/11/2026: scripts/unit.sh men-cd ke salinan tmp
          # sebelum menulis log — path relatif membuat log hilang dari
          # upload-artifact. Log ABSOLUT juga.
          echo "log1=$WS/unit-msvc-1.log" >> "$GITHUB_OUTPUT"
          echo "log2=$WS/unit-msvc-2.log" >> "$GITHUB_OUTPUT"
          # upload-artifact@v4 = node: tak membaca path MSYS /d/a/... atau
          # /tmp/... — keluarkan gaya WINDOWS (pelajaran run 10/11/2026:
          # 0 artifact walau step upload ✓).
          echo "log1w=$(cygpath -w "$WS/unit-msvc-1.log")" >> "$GITHUB_OUTPUT"
          echo "log2w=$(cygpath -w "$WS/unit-msvc-2.log")" >> "$GITHUB_OUTPUT"
          echo "stage=$(cygpath -w /tmp/satria-unit)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # cl.exe tidak ada di PATH bash runner — impor env vcvars
      # (PATH/INCLUDE/LIB) agar install.ps1 bisa memanggil cl langsung.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap build (install.ps1 --dev)
        shell: pwsh
        env:
          CC: cl
          SATRIA_VERSION: ${{ github.ref_name }}
        run: ./install.ps1 --dev

      - name: Smoke test version + help
        shell: bash
        run: |
          ./bin/satria.exe version
          ./bin/satria.exe help | head -20

      # Windows mengunci binary yang sedang berjalan: self-host build tidak
      # boleh menimpa binary-nya sendiri. Pola build.yml: salin bootstrap ke
      # bin/satria-bootstrap.exe, bangun dari situ.
      - name: Copy bootstrap binary
        shell: bash
        run: cp bin/satria.exe bin/satria-bootstrap.exe

      # Di Windows/MSVC ini menguji jalur tanpa file .d (pemindai #include),
      # translasi flag, dan link MSVC end-to-end.
      - name: Self-host build (Buildfile)
        shell: bash
        run: ./bin/satria-bootstrap.exe -j4

      - name: Self-host incremental (semua up-to-date)
        shell: bash
        run: ./bin/satria.exe

      # ---- unit suite (satria membangun proyek-proyek fixture) ----
      # Pelajaran run 05/11/2026: fixture WAJIB path ABSOLUT — runner men-cd
      # ke salinan tmp sebelum mengeksekusi test, jadi argumen relatif
      # membuat abspath() test gagal (cp: cannot stat / fixture kosong).
      - name: Unit suite (scripts/unit.sh)
        if: ${{ inputs.suite != '' }}
        shell: bash
        run: |
          T1="$(basename "${{ inputs.suite }}")"
          bash scripts/unit.sh bin/satria.exe "$T1" -j "${{ inputs.jobs }}" -o "${{ steps.suite.outputs.log1 }}"

      - name: Unit suite kedua (opsional)
        if: ${{ steps.suite.outputs.suite2 != '' }}
        shell: bash
        run: |
          T2="$(basename "${{ inputs.suite2 }}")"
          bash scripts/unit.sh bin/satria.exe "$T2" -j "${{ inputs.jobs }}" -o "${{ steps.suite.outputs.log2 }}"

      # ---- smoke pack.optimize = true di MSVC ----
      # Jalur pack TARBALL dua langkah (tar → gzip -1) perlu dibuktikan di
      # Windows: fsRenameReplace (rename atomik) + mkparent + runCmd shell
      # tar/gzip. Bukti "level ter-FASTEST" & dua langkah: FNAME field di
      # header gzip berisi "out.tar.part" (nama file tar flat — hanya
      # ditulis saat gzip menampung FILE, bukan lewat pipe `tar czf`).
      - name: Smoke pack.optimize = true (single project)
        shell: bash
        run: |
          mkdir -p smoke/src
          {
            printf 'use project\n\nsources = src\n\n'
            printf 'pack.name = smoke\n'
            printf 'pack.version = 1.0\n'
            printf 'pack.files = bin/smoke\n'
            printf 'pack.output = dist/{name}.tar.gz\n'
            printf 'pack.compress = gzip\n'
            printf 'pack.optimize = true\n'
          } > smoke/Buildfile
          printf 'int main(void){return 0;}\n' > smoke/src/main.c
          cd smoke
          ../bin/satria.exe -j2
          # tarball valid & memuat binary. Entri `bin/smoke` di Windows
          # di-resolve ke bin/smoke.exe oleh packResolveSource (entri
          # portable tanpa akhiran .exe).
          tar -tzf dist/smoke.tar.gz | grep -q 'smoke'
          gzip -tv dist/smoke.tar.gz
          # bukti jalur dua langkah: FNAME header gzip = out.tar.part
          head -c 64 dist/smoke.tar.gz | grep -aq 'out.tar.part' \
            && echo "SMOKE OK: optimize dua-langkah (FNAME=out.tar.part) + tarball valid"

      # Selalu unggah log walau salah satu suite gagal (suite ke-2 boleh
      # tidak jalan → if-no-files-found: ignore). Saat gagal, staging unit
      # (/tmp/satria-unit: log/snap-build.log, unit.log, run.env) diunggah
      # terpisah agar penyebab rc=1 selalu terlihat — pelajaran run
      # 42798946391: "build snap gagal" tanpa isi log karena die sebelum
      # log -o sempat ditulis dan path MSYS tak terbaca node.
      - name: Upload logs (always)
        if: ${{ always() && inputs.suite != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-logs-msvc
          path: |
            ${{ steps.suite.outputs.log1w }}
            ${{ steps.suite.outputs.log2w }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload staging unit (hanya saat gagal)
        if: ${{ failure() && inputs.suite != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-stage-debug
          path: ${{ steps.suite.outputs.stage }}/targets/**/log/**
          if-no-files-found: ignore
          retention-days: 14

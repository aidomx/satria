# Klasifikasi tes common. Setiap berkas di common/ wajib terdaftar di salah satu bagian.
# [cold] : tes memerlukan build dari nol (kontrak cold, atau sementara menunggu tinjauan)
# [snap] : tes memulai dari snapshot. Tes [snap] TIDAK boleh menghapus .satria, build, bin, lib.

[cold]
background
build_log
build_resume
cdeps_flag
report_artifact
selective_noop_full
# khusus fixture embed (miniws): PRECONDITION bila fixture tanpa bade+bademod.extract
embed_getembed
# sementara: cold sampai diputuskan (lihat design/unit_test.md §8 klasifikasi)
cdeps_group
cdeps_key_reject
embed_stamp_skip
semantic_header_workspace
trace_summary
workspace_selective_target

[snap]
cache_noop
cmdhelp_crlf
crud_touch_delete
faststate_external_header
legacy_sweep
opts_sources_sync
p_meta_noop
report_binaries_uptodate
router_noop
trace_src_sync
version_alias
